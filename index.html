<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدرسة التداول</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #18332b;
      line-height: 1.8;
    }

    header {
      padding: 22px 8%;
      background: #103c32;
      color: white;
    }

    main {
      max-width: 850px;
      margin: 70px auto;
      padding: 0 24px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    p {
      font-size: 19px;
      color: #52645e;
    }

    .card {
      margin-top: 36px;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px #18332b12;
    }

    footer {
      margin-top: 70px;
      padding: 20px;
      text-align: center;
      color: #64736e;
    }
  </style>
</head>
<body>
  <header>مدرسة التداول</header>

  <main>
    <h1>تعلّم التداول خطوة بخطوة</h1>
    <p>ابدأ رحلتك في فهم الأسواق المالية بأسلوب بسيط ومنظّم.</p>

    <div class="card">
      <h2>التعلّم يبدأ من هنا</h2>
      <p>سنضيف قريبًا دروسًا تساعدك على فهم أساسيات التداول وإدارة المخاطر.</p>
    </div>
  </main>

  <footer>محتوى تعليمي — التداول ينطوي على مخاطر</footer>
</body>
</html>
