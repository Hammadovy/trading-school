<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدرسة التداول</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #173b35;
      background-color: #f5f8f7;
      line-height: 1.8;
    }

    header {
      padding: 16px;
      color: white;
      background-color: #123f36;
      text-align: center;
    }

    main {
      width: min(90%, 700px);
      margin: 40px auto;
      text-align: center;
    }

    .card {
      display: block;
      margin: 28px auto;
      padding: 22px;
      color: inherit;
      text-decoration: none;
      background-color: white;
      border: 1px solid #d5e2de;
      border-radius: 12px;
      box-shadow: 0 4px 14px #173b3515;
    }

    .card:hover {
      background-color: #eaf3ef;
    }

    #learn {
      margin-top: 48px;
      padding: 24px;
      background-color: white;
      border-radius: 12px;
      scroll-margin-top: 20px;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      color: white;
      background-color: #123f36;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>مدرسة التداول</header>

  <main>
    <h1>تعلّم التداول خطوة بخطوة</h1>
    <p>ابدأ رحلتك في تعلّم أساسيات التداول بطريقة بسيطة وواضحة.</p>

    <a class="card" href="#learn">
      <h2>التعلم يبدأ من هنا</h2>
      <p>اضغط هنا للانتقال إلى بداية الدروس.</p>
    </a>

    <section id="learn">
      <h2>ابدأ التعلم</h2>
      <p>هنا تبدأ رحلتك. تعلّم الأساسيات أولًا، وافهم المخاطر قبل اتخاذ أي قرار.</p>
    </section>
  </main>

  <footer>مدرسة التداول — التعلّم يبدأ خطوة بخطوة</footer>
</body>
</html>
